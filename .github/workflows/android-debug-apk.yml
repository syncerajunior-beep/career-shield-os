name: Build Android Debug APK

on:
  push:
    branches:
      - mobile-apk-ci
      - firebase-apk-mainline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Create local debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Add and validate Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_APPLET_CONFIG_XML: ${{ secrets.FIREBASE_APPLET_CONFIG_XML }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON repository secret. Add the full app/google-services.json content in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text(encoding="utf-8"))
          project_id = config.get("project_info", {}).get("project_id")
          project_number = str(config.get("project_info", {}).get("project_number", ""))
          expected_project_id = "gen-lang-client-0855749762"
          expected_project_number = "132290729946"
          expected_package = "com.aistudio.careershield.rkmvqz"

          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }

          if project_id != expected_project_id:
              raise SystemExit(f"Wrong Firebase project_id: {project_id!r}")
          if project_number != expected_project_number:
              raise SystemExit(f"Wrong Firebase project_number: {project_number!r}")
          if expected_package not in package_names:
              raise SystemExit(
                  f"google-services.json does not contain Android package {expected_package!r}; "
                  f"found: {sorted(p for p in package_names if p)}"
              )

          print("Firebase project and Android package configuration validated.")
          PY

          if [ -n "$FIREBASE_APPLET_CONFIG_XML" ]; then
            mkdir -p app/src/main/res/values
            printf '%s' "$FIREBASE_APPLET_CONFIG_XML" > app/src/main/res/values/firebase_applet_config.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("app/src/main/res/values/firebase_applet_config.xml").getroot()
          if root.tag != "resources":
              raise SystemExit("firebase_applet_config.xml must have a <resources> root element.")
          print("Firebase applet resource configuration validated.")
          PY
          else
            echo "::notice::FIREBASE_APPLET_CONFIG_XML not provided. This Debug build can use Firebase AI Logic without Firestore database-ID or release reCAPTCHA resources; add the secret when those resources are needed."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: career-shield-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
